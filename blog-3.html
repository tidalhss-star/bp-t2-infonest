    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f1f3f5;
            --text-primary: #1a1a1a;
            --text-secondary: #495057;
            --text-tertiary: #868e96;
            --border-light: #e9ecef;
            --border-medium: #dee2e6;
            --accent-primary: #212529;
            --accent-secondary: #495057;
            --accent-hover: #000000;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --font-xs: 0.75rem;
            --font-sm: 0.875rem;
            --font-base: 1rem;
            --font-lg: 1.125rem;
            --font-xl: 1.25rem;
            --font-2xl: 1.5rem;
            --font-3xl: 1.875rem;
            --font-4xl: 2.25rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .site-header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-light);
            padding: 1.25rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.92);
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .logo {
            font-size: var(--font-xl);
            font-weight: 700;
            color: var(--accent-primary);
            text-decoration: none;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .logo span {
            color: var(--text-tertiary);
            font-weight: 400;
            font-size: var(--font-sm);
            margin-left: 0.25rem;
        }

        .nav-links {
            display: flex;
            gap: 1.75rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: var(--font-sm);
            font-weight: 500;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: var(--accent-primary);
        }

        .nav-links a.active {
            color: var(--accent-primary);
            font-weight: 600;
            position: relative;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-primary);
            border-radius: 1px;
        }

        .main-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }

        .page-header {
            margin-bottom: 3rem;
            text-align: center;
        }

        .page-label {
            display: inline-block;
            font-size: var(--font-xs);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 0.75rem;
            background: var(--bg-tertiary);
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
        }

        .page-title {
            font-size: var(--font-4xl);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            line-height: 1.25;
            margin-bottom: 0.75rem;
        }

        .page-subtitle {
            font-size: var(--font-lg);
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
            font-weight: 400;
        }

        .trend-marquee {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1rem 1.5rem;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            overflow: hidden;
            position: relative;
        }

        .marquee-label {
            font-size: var(--font-xs);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--accent-primary);
            background: var(--bg-primary);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            white-space: nowrap;
            border: 1px solid var(--border-medium);
            flex-shrink: 0;
        }

        .marquee-items {
            display: flex;
            gap: 2rem;
            animation: marquee-scroll 30s linear infinite;
            white-space: nowrap;
        }

        .marquee-item {
            font-size: var(--font-sm);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .marquee-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-primary);
            border-radius: 50%;
            flex-shrink: 0;
        }

        @keyframes marquee-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .feature-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 2rem;
            transition: box-shadow 0.25s ease, transform 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .feature-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .feature-card.accent-top::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-primary);
            border-radius: 3px 3px 0 0;
        }

        .card-badge {
            display: inline-block;
            font-size: var(--font-xs);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--accent-primary);
            background: var(--bg-tertiary);
            padding: 0.25rem 0.65rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: var(--font-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .card-description {
            font-size: var(--font-base);
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 1.25rem;
        }

        .card-stats {
            display: flex;
            gap: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-light);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .stat-value {
            font-size: var(--font-2xl);
            font-weight: 700;
            color: var(--accent-primary);
            letter-spacing: -0.03em;
        }

        .stat-label {
            font-size: var(--font-xs);
            color: var(--text-tertiary);
            letter-spacing: 0.02em;
        }

        .trend-table-wrap {
            margin-bottom: 3rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .trend-table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--font-sm);
            min-width: 600px;
        }

        .trend-table thead th {
            background: var(--bg-secondary);
            padding: 1rem 1.25rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            font-size: var(--font-xs);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-medium);
        }

        .trend-table tbody td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
            vertical-align: top;
        }

        .trend-table tbody tr:hover {
            background: var(--bg-secondary);
        }

        .trend-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 600;
            font-size: var(--font-sm);
        }

        .trend-up {
            color: #2b8a3e;
        }

        .trend-down {
            color: #c92a2a;
        }

        .trend-stable {
            color: var(--text-tertiary);
        }

        .insight-banner {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
        }

        .insight-banner::after {
            content: '';
            position: absolute;
            right: -40px;
            top: -40px;
            width: 180px;
            height: 180px;
            background: var(--bg-tertiary);
            border-radius: 50%;
            opacity: 0.4;
        }

        .insight-banner-content {
            position: relative;
            z-index: 1;
        }

        .insight-title {
            font-size: var(--font-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        .insight-text {
            font-size: var(--font-base);
            color: var(--text-secondary);
            max-width: 600px;
            line-height: 1.7;
        }

        .related-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
            margin-bottom: 3rem;
        }

        .related-link-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.25s ease;
            display: block;
        }

        .related-link-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--border-medium);
            transform: translateY(-1px);
        }

        .related-link-title {
            font-size: var(--font-base);
            font-weight: 600;
            margin-bottom: 0.4rem;
            letter-spacing: -0.01em;
        }

        .related-link-desc {
            font-size: var(--font-sm);
            color: var(--text-tertiary);
            line-height: 1.5;
        }

        .faq-section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: var(--font-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .faq-item {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            transition: box-shadow 0.25s ease;
        }

        .faq-item:hover {
            box-shadow: var(--shadow-sm);
        }

</body>
